<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ec5b13",
                        "background-light": "#f8f6f6",
                        "background-dark": "#221610",
                    },
                    fontFamily: {
                        "display": ["Public Sans"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<title>Forgot Password - SocialCommerce</title>
</head>
<body class="bg-background-light dark:bg-background-dark font-display min-h-screen flex flex-col items-center justify-center p-4">
<!-- Main Content -->
<main class="w-full max-w-md">
<!-- Card Container -->
<div class="bg-white dark:bg-slate-900/50 border border-slate-200 dark:border-slate-800 rounded-xl shadow-xl shadow-slate-200/50 dark:shadow-none overflow-hidden">
<div class="p-8">
<!-- Icon & Title -->
<div class="flex flex-col items-center text-center mb-8">
<div class="size-16 bg-primary/10 rounded-full flex items-center justify-center mb-4">
<span class="material-symbols-outlined text-primary text-3xl">lock_reset</span>
</div>
<h2 class="text-2xl font-bold text-slate-900 dark:text-slate-100">Forgot Password</h2>
<p class="text-slate-500 dark:text-slate-400 mt-2">
                        Enter your email to receive a recovery link
                    </p>
</div>
<!-- Form -->
<!-- Backend Endpoint: POST /api/auth/forgot-password -->
<form action="#" class="space-y-6" method="POST">
<div class="space-y-2">
<label class="text-sm font-medium text-slate-700 dark:text-slate-300 ml-1" for="email">
                            Email address
                        </label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-slate-400 text-xl">mail</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border border-slate-200 dark:border-slate-700 rounded-lg bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all duration-200" id="email" name="email" placeholder="name@example.com" required="" type="email"/>
</div>
</div>
<!-- Hidden success message placeholder (to be shown by JS based on spec) -->
<div class="hidden p-4 bg-emerald-50 dark:bg-emerald-900/20 border border-emerald-100 dark:border-emerald-800 rounded-lg" id="success-message">
<p class="text-sm text-emerald-700 dark:text-emerald-400 text-center">
                            If this email is registered, we have sent a password reset link.
                        </p>
</div>
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-3.5 px-4 rounded-lg shadow-lg shadow-primary/20 flex items-center justify-center gap-2 transition-all active:scale-[0.98]" type="submit">
<span>Send Recovery Link</span>
<span class="material-symbols-outlined text-xl">arrow_forward</span>
</button>
</form>
<!-- Navigation -->
<div class="mt-8 pt-6 border-t border-slate-100 dark:border-slate-800 text-center">
<a class="text-sm font-medium text-slate-500 dark:text-slate-400 hover:text-primary dark:hover:text-primary transition-colors inline-flex items-center gap-1 group" href="/login">
<span class="material-symbols-outlined text-lg group-hover:-translate-x-1 transition-transform">chevron_left</span>
                        Back to Login
                    </a>
</div>
</div>
</div>
<!-- Decorative Elements -->
<div class="mt-8 flex justify-center gap-8">
<div class="flex items-center gap-2 text-xs text-slate-400 dark:text-slate-500">
<span class="material-symbols-outlined text-base">shield</span>
                Secure Encryption
            </div>
<div class="flex items-center gap-2 text-xs text-slate-400 dark:text-slate-500">
<span class="material-symbols-outlined text-base">verified_user</span>
                Spam Protection
            </div>
</div>
</main>
</body></html>
