<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Become a Seller - Shop Information</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ec5b13",
                        "background-light": "#f8f6f6",
                        "background-dark": "#221610",
                    },
                    fontFamily: {
                        "display": ["Public Sans"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen">
<div class="layout-container flex h-full grow flex-col items-center">
<main class="w-full max-w-4xl mt-12 mb-12 px-6">
<!-- Stepper Component -->
<div class="bg-white dark:bg-slate-900 p-6 rounded-xl shadow-sm border border-slate-200 dark:border-slate-800 mb-6">
<div class="flex items-center justify-between mb-4">
<div class="flex flex-col gap-1">
<p class="text-sm font-semibold text-primary uppercase tracking-wider">Step 1 of 3</p>
<h1 class="text-2xl font-bold">Shop Information</h1>
</div>
<div class="text-right">
<span class="text-sm font-medium text-slate-500">33% Complete</span>
</div>
</div>
<div class="w-full bg-slate-100 dark:bg-slate-800 h-2.5 rounded-full overflow-hidden">
<div class="bg-primary h-full rounded-full transition-all duration-500" style="width: 33.33%;"></div>
</div>
<div class="grid grid-cols-3 gap-4 mt-6">
<div class="flex items-center gap-2">
<div class="size-6 rounded-full bg-primary text-white flex items-center justify-center text-xs font-bold">1</div>
<span class="text-xs font-semibold">General Info</span>
</div>
<div class="flex items-center gap-2">
<div class="size-6 rounded-full bg-slate-200 dark:bg-slate-700 text-slate-500 flex items-center justify-center text-xs font-bold">2</div>
<span class="text-xs font-medium text-slate-400">Verification</span>
</div>
<div class="flex items-center gap-2">
<div class="size-6 rounded-full bg-slate-200 dark:bg-slate-700 text-slate-500 flex items-center justify-center text-xs font-bold">3</div>
<span class="text-xs font-medium text-slate-400">Payment Setup</span>
</div>
</div>
</div>
<!-- Main Form Container -->
<div class="bg-white dark:bg-slate-900 rounded-xl shadow-sm border border-slate-200 dark:border-slate-800 overflow-hidden">
<div class="p-8">
<!-- Media Upload Section -->
<div class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-10">
<div class="col-span-1 flex flex-col items-center md:items-start">
<label class="block text-sm font-semibold mb-3">Shop Logo</label>
<div class="relative group cursor-pointer">
<div class="size-32 rounded-full border-2 border-dashed border-slate-300 dark:border-slate-700 flex flex-col items-center justify-center bg-slate-50 dark:bg-slate-800/50 overflow-hidden hover:border-primary transition-colors">
<span class="material-symbols-outlined text-slate-400 text-3xl mb-1 group-hover:text-primary">add_a_photo</span>
<span class="text-[10px] text-slate-500 font-medium">UPLOAD</span>
</div>
<div class="absolute inset-0 rounded-full bg-center bg-cover hidden" data-alt="Circular placeholder for a modern brand shop logo"></div>
</div>
<p class="text-xs text-slate-500 mt-2 text-center md:text-left">Recommended: 500x500px JPG/PNG</p>
</div>
<div class="col-span-1 md:col-span-2">
<label class="block text-sm font-semibold mb-3">Cover Photo</label>
<div class="relative group cursor-pointer w-full h-32 border-2 border-dashed border-slate-300 dark:border-slate-700 rounded-xl flex flex-col items-center justify-center bg-slate-50 dark:bg-slate-800/50 overflow-hidden hover:border-primary transition-colors">
<span class="material-symbols-outlined text-slate-400 text-3xl mb-1 group-hover:text-primary">image</span>
<span class="text-xs text-slate-500 font-medium">Click to upload shop banner</span>
<div class="absolute inset-0 hidden bg-center bg-cover" data-alt="Wide abstract landscape background for shop cover photo"></div>
</div>
<p class="text-xs text-slate-500 mt-2">Recommended: 1200x400px</p>
</div>
</div>
<!-- Input Fields -->
<div class="space-y-6">
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<div class="flex flex-col gap-2">
<label class="text-sm font-semibold" for="shop-name">Shop Name</label>
<input class="w-full px-4 py-2.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all" id="shop-name" placeholder="Enter your business name" type="text"/>
</div>
<div class="flex flex-col gap-2">
<label class="text-sm font-semibold" for="shop-category">Shop Category</label>
<div class="relative">
<select class="w-full appearance-none px-4 py-2.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all" id="shop-category">
<option disabled="" selected="" value="">Select a category</option>
<option value="electronics">Electronics</option>
<option value="fashion">Fashion &amp; Apparel</option>
<option value="home">Home &amp; Living</option>
<option value="beauty">Beauty &amp; Wellness</option>
<option value="other">Other</option>
</select>
<div class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-slate-400">
<span class="material-symbols-outlined text-lg">expand_more</span>
</div>
</div>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="text-sm font-semibold" for="shop-description">Shop Description</label>
<textarea class="w-full px-4 py-2.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all resize-none" id="shop-description" placeholder="Tell customers about your shop, brand values, and what you sell..." rows="4"></textarea>
</div>
<div class="flex flex-col gap-2">
<label class="text-sm font-semibold" for="business-address">Business Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-lg">location_on</span>
<input class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all" data-location="New York City" id="business-address" placeholder="123 Business St, Suite 100, City, Country" type="text"/>
</div>
</div>
</div>
</div>
<!-- Form Footer Actions -->
<div class="bg-slate-50 dark:bg-slate-800/50 p-6 flex items-center justify-between border-t border-slate-200 dark:border-slate-800">
<button class="px-6 py-2.5 rounded-lg border border-slate-200 dark:border-slate-700 text-slate-400 bg-slate-100 dark:bg-slate-800 font-semibold text-sm cursor-not-allowed flex items-center gap-2" disabled="">
<span class="material-symbols-outlined text-lg">arrow_back</span>
                        Back
                    </button>
<div class="flex items-center gap-4">
<span class="text-xs text-slate-500 font-medium hidden sm:block">You can always edit this later</span>
<button class="px-8 py-2.5 rounded-lg bg-primary hover:bg-primary/90 text-white font-bold text-sm transition-colors flex items-center gap-2 shadow-md shadow-primary/20">
                            Next Step
                            <span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
</div>
</div>
</div>
</main>
</div>
</body></html>
