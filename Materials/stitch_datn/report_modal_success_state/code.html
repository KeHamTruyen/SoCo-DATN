<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ec5b13",
                        "background-light": "#f8f6f6",
                        "background-dark": "#221610",
                    },
                    fontFamily: {
                        "display": ["Public Sans"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},

<title>Báo cáo thành công</title>
</head>
<body class="bg-background-light dark:bg-background-dark font-display flex items-center justify-center min-h-screen p-4">
<!-- Modal Container -->
<div class="relative w-full max-w-[400px] bg-white dark:bg-slate-900 rounded-xl shadow-2xl overflow-hidden border border-slate-200 dark:border-slate-800">
<!-- Content Area -->
<div class="p-8 flex flex-col items-center text-center">
<!-- Success Icon Circle -->
<div class="mb-6 flex items-center justify-center w-20 h-20 rounded-full bg-primary/10 text-primary">
<span class="material-symbols-outlined text-5xl" style="font-variation-settings: 'OPSZ' 48, 'wght' 400, 'FILL' 0, 'GRAD' 0;">
                    check_circle
                </span>
</div>
<!-- Text Content -->
<h3 class="text-slate-900 dark:text-slate-100 text-2xl font-bold leading-tight mb-2">
                Báo cáo thành công
            </h3>
<p class="text-slate-600 dark:text-slate-400 text-base font-normal leading-relaxed mb-8">
                Cảm ơn bạn đã báo cáo. Chúng tôi sẽ xử lý trong thời gian sớm nhất
            </p>
<!-- Action Button -->
<div class="w-full">
<button class="w-full flex cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-6 bg-primary hover:bg-primary/90 text-white text-sm font-semibold transition-colors duration-200">
<span class="truncate">Đóng</span>
</button>
</div>
</div>
<!-- Decorative Image Component (Background Pattern) -->

</div>
