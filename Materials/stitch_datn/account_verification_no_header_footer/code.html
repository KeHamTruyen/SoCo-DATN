<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Verify Your Account | SocialShop</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ec5b13",
                        "background-light": "#f8f6f6",
                        "background-dark": "#221610",
                    },
                    fontFamily: {
                        "display": ["Public Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: "Public Sans", sans-serif;
        }
        /* Hide spin buttons for Chrome, Safari, Edge, Opera */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        /* Hide spin buttons for Firefox */
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex items-center justify-center p-6">
<main class="max-w-[440px] w-full flex flex-col items-center text-center space-y-8">
<div class="relative">
<div class="w-24 h-24 bg-primary/10 dark:bg-primary/20 rounded-full flex items-center justify-center mb-2">
<span class="material-symbols-outlined text-primary text-5xl">mail</span>
</div>
<div class="absolute -bottom-1 -right-1 bg-white dark:bg-background-dark p-1 rounded-full shadow-sm">
<span class="material-symbols-outlined text-green-500 text-2xl fill-1">check_circle</span>
</div>
</div>
<div class="space-y-2">
<h2 class="text-3xl font-bold tracking-tight text-slate-900 dark:text-white">Verify Your Account</h2>
<p class="text-slate-500 dark:text-slate-400 max-w-[320px] mx-auto">
                We've sent a 6-digit confirmation code to <span class="font-medium text-slate-900 dark:text-white">sarah@example.com</span>
</p>
</div>
<form class="w-full space-y-6">
<div class="flex justify-between gap-2 sm:gap-4">
<input class="w-12 h-14 sm:w-14 sm:h-16 text-center text-2xl font-bold rounded-xl border-2 border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 focus:border-primary focus:ring-primary transition-all outline-none" maxlength="1" name="otp-1" placeholder="·" required="" type="number"/>
<input class="w-12 h-14 sm:w-14 sm:h-16 text-center text-2xl font-bold rounded-xl border-2 border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 focus:border-primary focus:ring-primary transition-all outline-none" maxlength="1" name="otp-2" placeholder="·" required="" type="number"/>
<input class="w-12 h-14 sm:w-14 sm:h-16 text-center text-2xl font-bold rounded-xl border-2 border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 focus:border-primary focus:ring-primary transition-all outline-none" maxlength="1" name="otp-3" placeholder="·" required="" type="number"/>
<input class="w-12 h-14 sm:w-14 sm:h-16 text-center text-2xl font-bold rounded-xl border-2 border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 focus:border-primary focus:ring-primary transition-all outline-none" maxlength="1" name="otp-4" placeholder="·" required="" type="number"/>
<input class="w-12 h-14 sm:w-14 sm:h-16 text-center text-2xl font-bold rounded-xl border-2 border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 focus:border-primary focus:ring-primary transition-all outline-none" maxlength="1" name="otp-5" placeholder="·" required="" type="number"/>
<input class="w-12 h-14 sm:w-14 sm:h-16 text-center text-2xl font-bold rounded-xl border-2 border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 focus:border-primary focus:ring-primary transition-all outline-none" maxlength="1" name="otp-6" placeholder="·" required="" type="number"/>
</div>
<div class="space-y-4">
<button class="w-full h-12 bg-primary hover:bg-primary/90 text-white font-semibold rounded-xl transition-colors shadow-lg shadow-primary/20" type="submit">
                    Confirm Account
                </button>
<div class="flex flex-col items-center gap-1">
<p class="text-sm text-slate-500 dark:text-slate-400">Didn't receive a code?</p>
<button class="text-sm font-semibold text-slate-400 dark:text-slate-600 cursor-not-allowed flex items-center gap-1" disabled="" type="button">
                        Resend code <span class="text-primary font-medium">(00:59)</span>
</button>
</div>
</div>
</form>
<div class="pt-8 border-t border-slate-200 dark:border-slate-800 w-full">
<a class="inline-flex items-center gap-2 text-sm font-medium text-slate-500 hover:text-primary transition-colors" href="/login">
<span class="material-symbols-outlined text-[18px]">arrow_back</span>
                Back to login
            </a>
</div>
</main>
</body></html>
