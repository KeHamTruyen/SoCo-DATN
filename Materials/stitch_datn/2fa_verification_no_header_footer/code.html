<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Two-Factor Authentication | Social Commerce</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              colors: {
                "primary": "#ec5b13",
                "background-light": "#f8f6f6",
                "background-dark": "#221610",
              },
              fontFamily: {
                "display": ["Public Sans", "sans-serif"]
              },
              borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
            },
          },
        }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen flex items-center justify-center p-4">
<div class="w-full max-w-md bg-white dark:bg-slate-900 shadow-xl border border-slate-200 dark:border-slate-800 rounded-xl overflow-hidden">
<div class="p-6 sm:p-8 flex flex-col items-center text-center">
<div class="size-16 bg-primary/10 dark:bg-primary/20 rounded-full flex items-center justify-center mb-6">
<span class="material-symbols-outlined text-primary text-4xl">
                    shield_lock
                </span>
</div>
<h1 class="text-2xl font-bold tracking-tight mb-2">Two-Factor Authentication</h1>
<p class="text-slate-500 dark:text-slate-400 text-sm mb-8">
                OTP has been sent to your email
            </p>
<form class="w-full space-y-8">
<!-- Hidden field for tempToken as per spec -->
<input name="tempToken" type="hidden" value=""/>
<div class="flex justify-center gap-2 sm:gap-3">
<input autocomplete="one-time-code" class="w-10 h-12 sm:w-12 sm:h-14 text-center text-xl font-bold border-2 border-slate-200 dark:border-slate-700 bg-transparent rounded-lg focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all dark:text-white" inputmode="numeric" maxlength="1" name="otp_1" required="" type="text"/>
<input class="w-10 h-12 sm:w-12 sm:h-14 text-center text-xl font-bold border-2 border-slate-200 dark:border-slate-700 bg-transparent rounded-lg focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all dark:text-white" inputmode="numeric" maxlength="1" name="otp_2" required="" type="text"/>
<input class="w-10 h-12 sm:w-12 sm:h-14 text-center text-xl font-bold border-2 border-slate-200 dark:border-slate-700 bg-transparent rounded-lg focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all dark:text-white" inputmode="numeric" maxlength="1" name="otp_3" required="" type="text"/>
<input class="w-10 h-12 sm:w-12 sm:h-14 text-center text-xl font-bold border-2 border-slate-200 dark:border-slate-700 bg-transparent rounded-lg focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all dark:text-white" inputmode="numeric" maxlength="1" name="otp_4" required="" type="text"/>
<input class="w-10 h-12 sm:w-12 sm:h-14 text-center text-xl font-bold border-2 border-slate-200 dark:border-slate-700 bg-transparent rounded-lg focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all dark:text-white" inputmode="numeric" maxlength="1" name="otp_5" required="" type="text"/>
<input class="w-10 h-12 sm:w-12 sm:h-14 text-center text-xl font-bold border-2 border-slate-200 dark:border-slate-700 bg-transparent rounded-lg focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all dark:text-white" inputmode="numeric" maxlength="1" name="otp_6" required="" type="text"/>
</div>
<div class="space-y-4">
<button class="w-full h-12 bg-primary hover:opacity-90 text-white font-semibold rounded-lg transition-colors shadow-lg shadow-primary/20 flex items-center justify-center gap-2" type="submit">
                        Verify
                    </button>
<div class="flex items-center justify-center gap-1 text-sm">
<span class="text-slate-500 dark:text-slate-400">Didn't receive code?</span>
<button class="text-primary font-medium hover:underline" type="button">Resend code</button>
</div>
</div>
</form>
</div>
</div>
</body></html>
