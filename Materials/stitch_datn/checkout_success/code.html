<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ec5b13",
                        "background-light": "#f8f6f6",
                        "background-dark": "#221610",
                    },
                    fontFamily: {
                        "display": ["Public Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display min-h-screen">
<!-- Background Content (Mockup of Checkout Page) -->
<div class="fixed inset-0 z-0 overflow-hidden filter blur-sm grayscale-[0.2]">
<!-- Unified Header from SCREEN_59 -->
<header class="w-full bg-white dark:bg-background-dark border-b border-slate-200 dark:border-slate-800">
<div class="max-w-[1440px] mx-auto px-6 h-16 flex items-center justify-between gap-8">
<!-- Logo & Nav -->
<div class="flex items-center gap-8">
<div class="flex items-center gap-2 shrink-0">
<div class="bg-primary p-1.5 rounded-lg text-white">
<span class="material-symbols-outlined block">shopping_bag</span>
</div>
<h2 class="text-xl font-bold tracking-tight text-slate-900 dark:text-slate-100">SocialCommerce</h2>
</div>
<nav class="hidden md:flex items-center gap-8">
<a class="text-sm font-bold text-primary border-b-2 border-primary py-5" href="#">Feed</a>
<a class="text-sm font-medium text-slate-500 hover:text-primary transition-colors py-5" href="#">Marketplace</a>
</nav>
</div>
<!-- Search Bar -->
<div class="flex-1 max-w-2xl">
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
<span class="material-symbols-outlined text-[20px]">search</span>
</div>
<input class="block w-full pl-10 pr-3 py-2 border border-slate-200 dark:border-slate-700 rounded-lg bg-slate-50 dark:bg-slate-800 focus:ring-1 focus:ring-primary focus:border-primary transition-all text-sm" placeholder="Search products, sellers, or hashtags..." type="text"/>
</div>
</div>
<!-- Actions -->
<div class="flex items-center gap-6">
<button class="text-slate-600 dark:text-slate-300 hover:text-primary relative">
<span class="material-symbols-outlined">notifications</span>
<span class="absolute -top-0.5 -right-0.5 w-2 h-2 bg-primary rounded-full border-2 border-white dark:border-background-dark"></span>
</button>
<button class="text-slate-600 dark:text-slate-300 hover:text-primary">
<span class="material-symbols-outlined">chat_bubble</span>
</button>
<button class="text-slate-600 dark:text-slate-300 hover:text-primary">
<span class="material-symbols-outlined">shopping_cart</span>
</button>
<div class="w-8 h-8 rounded-full overflow-hidden shrink-0 cursor-pointer">
<img class="w-full h-full object-cover" data-alt="User profile avatar portrait" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBiUG13wO72lnKQbFz8mfUSHBTviCjCxJ7cEENUpWGXw0OQfJQekzsBakRCjmTyR5r83p5V34RbIBlHgGs8wkxWwgwg14kAdp0lV4U4mP4qAo_dFLz9lkO-Pxi7ryL4fRWi1F9kWps3DVfhj0LDjwRQt8c0o-mlwY-y31dXOygBazAzQtGip7HQIyAb70h8XT-RBH3EUlZimmQbbhPN5PYMrbcxvKkyCiO335LYseU39YA9vy5rpwBhpqW_pmTrM8b8znz-AmM7dR_y"/>
</div>
</div>
</div>
</header>
<div class="max-w-6xl mx-auto px-4 py-8 flex flex-col gap-8">
<div class="grid grid-cols-3 gap-8">
<div class="col-span-2 space-y-4">
<div class="h-40 bg-slate-200 dark:bg-slate-800 rounded-xl"></div>
<div class="h-64 bg-slate-200 dark:bg-slate-800 rounded-xl"></div>
</div>
<div class="h-96 bg-slate-200 dark:bg-slate-800 rounded-xl"></div>
</div>
</div>
</div>
<!-- Modal Overlay -->
<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
<!-- Success Card -->
<div class="w-full max-w-md bg-white dark:bg-slate-900 rounded-xl shadow-2xl overflow-hidden animate-in fade-in zoom-in duration-300">
<!-- Header/Icon Section -->
<div class="relative h-48 flex items-center justify-center bg-primary/5 dark:bg-primary/10 overflow-hidden">
<!-- Abstract Pattern Background -->
<div class="absolute inset-0 opacity-10" data-alt="Subtle orange dot pattern background" style="background-image: radial-gradient(circle at 2px 2px, #ec5b13 1px, transparent 0); background-size: 24px 24px;"></div>
<div class="relative flex flex-col items-center">
<div class="bg-primary text-white rounded-full p-4 shadow-lg shadow-primary/30 mb-4">
<span class="material-symbols-outlined text-5xl leading-none">check_circle</span>
</div>
<h2 class="text-2xl font-bold text-slate-900 dark:text-slate-100">Order Successful!</h2>
</div>
</div>
<!-- Content Section -->
<div class="px-8 pt-6 pb-8 space-y-6">
<p class="text-center text-slate-600 dark:text-slate-400">
                    Your order has been placed successfully! We've sent a confirmation email to your inbox.
                </p>
<!-- Order Details Card -->
<div class="bg-background-light dark:bg-slate-800/50 rounded-lg p-4 space-y-3 border border-slate-200 dark:border-slate-700">
<div class="flex justify-between items-center text-sm">
<span class="text-slate-500 dark:text-slate-400 font-medium">Order ID</span>
<span class="text-slate-900 dark:text-slate-100 font-bold font-mono">#SC-982341</span>
</div>
<div class="border-t border-slate-200 dark:border-slate-700 pt-3 flex justify-between items-center text-sm">
<span class="text-slate-500 dark:text-slate-400 font-medium">Estimated Delivery</span>
<span class="text-primary font-semibold">Oct 24 - Oct 26, 2023</span>
</div>
</div>
<!-- Action Buttons -->
<div class="flex flex-col gap-3 pt-2">
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-3.5 px-6 rounded-xl transition-colors flex items-center justify-center gap-2">
                        View My Orders
                        <span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
<button class="w-full bg-transparent hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-400 font-medium py-3 px-6 rounded-xl transition-colors">
                        Back to Home
                    </button>
</div>
</div>
<!-- Social Share (Contextual for SocialCommerce) -->
<div class="border-t border-slate-100 dark:border-slate-800 px-8 py-4 bg-slate-50/50 dark:bg-slate-900/50 flex items-center justify-center gap-4">
<span class="text-xs text-slate-400 uppercase tracking-wider font-semibold">Share your purchase</span>
<div class="flex gap-2">
<button class="size-8 rounded-full bg-slate-200 dark:bg-slate-800 flex items-center justify-center text-slate-600 dark:text-slate-400 hover:text-primary transition-colors">
<span class="material-symbols-outlined text-lg">share</span>
</button>
<button class="size-8 rounded-full bg-slate-200 dark:bg-slate-800 flex items-center justify-center text-slate-600 dark:text-slate-400 hover:text-primary transition-colors">
<span class="material-symbols-outlined text-lg">camera_alt</span>
</button>
</div>
</div>
</div>
</div>
</body></html>
