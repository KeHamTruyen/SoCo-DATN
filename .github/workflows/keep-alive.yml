# Render Free web services sleep after ~15 minutes idle.
# Ping every 10 minutes (UTC) so BE does not cold-start on the next visitor.
name: Keep Render warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Render health endpoints
        run: |
          set -euo pipefail
          ping_url() {
            echo "ping $1"
            curl -fsS --retry 2 --retry-all-errors --max-time 90 "$1" >/dev/null
          }
          ping_url https://be-socomain.onrender.com/health
          ping_url https://be-socoadmin.onrender.com/health
          ping_url https://socomain.onrender.com
          ping_url https://socoadmin.onrender.com
