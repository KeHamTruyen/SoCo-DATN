<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/vite.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!-- Keep localStorage key in sync with ThemePreferenceProvider (soco-theme-preference) -->
        <script>
            (function () {
                var key = "soco-theme-preference";
                var pref = localStorage.getItem(key);
                var dark =
                    pref === "dark" ||
                    (pref !== "light" &&
                        window.matchMedia("(prefers-color-scheme: dark)").matches);
                var root = document.documentElement;
                root.classList.toggle("dark", dark);
                root.style.colorScheme = dark ? "dark" : "light";
            })();
        </script>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,300..900;1,300..900&display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
            rel="stylesheet"
        />
        <title>SoCo Admin</title>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
